<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Ramirez Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
        }
        
        .blue-underline {
            width: 60px;
            height: 4px;
            background: #3b82f6;
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen">
    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-[#0a0a0a]/80 backdrop-blur-lg border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold">
                    R
                </div>
                <span class="text-xl font-bold">Ramirez</span>
            </div>
            <div class="hidden md:flex items-center gap-8 text-gray-400">
                <a href="{{ url_for('home') }}" class="hover:text-white transition">Home</a>
                <a href="{{ url_for('about') }}" class="hover:text-white transition">About</a>
                <a href="{{ url_for('skills') }}" class="hover:text-white transition">Skills</a>
                <a href="{{ url_for('projects') }}" class="hover:text-white transition">Projects</a>
                <a href="{{ url_for('experience') }}" class="hover:text-white transition">Experience</a>
                <a href="{{ url_for('contact') }}" class="text-blue-500 font-semibold">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Contact Content -->
    <section class="pt-32 pb-20 px-6">
        <div class="max-w-6xl mx-auto">
            <!-- Page Title -->
            <div class="text-center mb-16">
                <h1 class="text-5xl font-bold mb-4">Get In Touch</h1>
                <div class="blue-underline"></div>
            </div>

            <div class="grid md:grid-cols-2 gap-12">
                <!-- Left Side - Contact Info -->
                <div>
                    <p class="text-lg text-gray-400 mb-8 leading-relaxed">
                        {{ intro }}
                    </p>

                    <!-- Contact Cards -->
                    <div class="space-y-4">
                        <!-- Email -->
                        <div class="bg-gray-900/50 border border-gray-800 rounded-xl p-5 flex items-center gap-4 hover:border-blue-500/50 transition">
                            <div class="w-12 h-12 bg-blue-500/10 rounded-lg flex items-center justify-center">
                                <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                                </svg>
                            </div>
                            <div class="flex-1">
                                <a href="mailto:{{ email }}" class="text-gray-300 hover:text-blue-500 transition break-all">{{ email }}</a>
                            </div>
                        </div>

                        <!-- GitHub -->
                        <div class="bg-gray-900/50 border border-gray-800 rounded-xl p-5 flex items-center gap-4 hover:border-blue-500/50 transition">
                            <div class="w-12 h-12 bg-blue-500/10 rounded-lg flex items-center justify-center">
                                <svg class="w-6 h-6 text-blue-500" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                                </svg>
                            </div>
                            <div class="flex-1">
                                <a href="{{ github }}" target="_blank" class="text-gray-300 hover:text-blue-500 transition break-all">{{ github }}</a>
                            </div>
                        </div>

                        <!-- LinkedIn -->
                        <div class="bg-gray-900/50 border border-gray-800 rounded-xl p-5 flex items-center gap-4 hover:border-blue-500/50 transition">
                            <div class="w-12 h-12 bg-blue-500/10 rounded-lg flex items-center justify-center">
                                <svg class="w-6 h-6 text-blue-500" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                                </svg>
                            </div>
                            <div class="flex-1">
                                <a href="{{ linkedin }}" target="_blank" class="text-gray-300 hover:text-blue-500 transition break-all">{{ linkedin }}</a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Side - Contact Form -->
                <div class="bg-gray-900/30 border border-gray-800 rounded-2xl p-8">
                    <h2 class="text-2xl font-bold mb-6">Send Me a Message</h2>
                    
                    <!-- Success Message -->
                    <div id="successMessage" class="hidden bg-green-500/10 border border-green-500/50 rounded-lg p-4 mb-6">
                        <p class="text-green-500 text-sm">✓ Message sent successfully!</p>
                    </div>

                    <!-- Error Message -->
                    <div id="errorMessage" class="hidden bg-red-500/10 border border-red-500/50 rounded-lg p-4 mb-6">
                        <p class="text-red-500 text-sm" id="errorText">Something went wrong. Please try again.</p>
                    </div>

                    <div id="contactForm">
                        <!-- Name -->
                        <div class="mb-5">
                            <label class="block text-gray-300 text-sm font-medium mb-2">Name</label>
                            <input 
                                type="text" 
                                id="name"
                                placeholder="Your name" 
                                class="w-full bg-gray-800/50 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
                                required
                            >
                        </div>

                        <!-- Email -->
                        <div class="mb-5">
                            <label class="block text-gray-300 text-sm font-medium mb-2">Email</label>
                            <input 
                                type="email" 
                                id="email"
                                placeholder="your@email.com" 
                                class="w-full bg-gray-800/50 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
                                required
                            >
                        </div>

                        <!-- Message -->
                        <div class="mb-6">
                            <label class="block text-gray-300 text-sm font-medium mb-2">Message</label>
                            <textarea 
                                id="message"
                                rows="5" 
                                placeholder="Your message..." 
                                class="w-full bg-gray-800/50 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition resize-none"
                                required
                            ></textarea>
                        </div>

                        <!-- Submit Button -->
                        <button 
                            id="submitBtn"
                            class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 rounded-lg transition duration-200 flex items-center justify-center gap-2"
                        >
                            <span id="btnText">Send Message</span>
                            <svg id="btnIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        submitBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            
            // Get form values
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message').value.trim();

            // Validate
            if (!name || !email || !message) {
                errorText.textContent = 'Please fill in all fields.';
                errorMessage.classList.remove('hidden');
                setTimeout(() => errorMessage.classList.add('hidden'), 3000);
                return;
            }

            // Show loading state
            submitBtn.disabled = true;
            btnText.textContent = 'Sending...';
            btnIcon.innerHTML = '<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>';

            try {
                const response = await fetch('/send-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, email, message })
                });

                const data = await response.json();

                if (response.ok) {
                    // Success
                    successMessage.classList.remove('hidden');
                    errorMessage.classList.add('hidden');
                    
                    // Clear form
                    document.getElementById('name').value = '';
                    document.getElementById('email').value = '';
                    document.getElementById('message').value = '';

                    setTimeout(() => successMessage.classList.add('hidden'), 5000);
                } else {
                    // Error from server
                    errorText.textContent = data.error || 'Failed to send message.';
                    errorMessage.classList.remove('hidden');
                    setTimeout(() => errorMessage.classList.add('hidden'), 3000);
                }
            } catch (error) {
                // Network error
                errorText.textContent = 'Network error. Please check your connection.';
                errorMessage.classList.remove('hidden');
                setTimeout(() => errorMessage.classList.add('hidden'), 3000);
            } finally {
                // Reset button
                submitBtn.disabled = false;
                btnText.textContent = 'Send Message';
                btnIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>';
            }
        });
    </script>
</body>
</html>
